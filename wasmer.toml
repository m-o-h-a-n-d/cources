# Wasmer manifest for PHP application routing
[package]
name = "m-o-h-a-n-d/cources"
version = "0.1.0"
description = "Student & Course Management System"
entrypoint = "start"

[dependencies]
"phpix/phpix-83-32bit" = "=0.3.0-rc.2"

[fs]
"/app" = "."

[[command]]
name = "start"
module = "phpix/phpix-83-32bit:phpix"
runner = "wasi"

[command.annotations.wasi]
cwd = "/app"
main-args = [
    "-S",
    "0.0.0.0:8080",
    "-t",
    "/app/public",
    "/app/public/router.php"
]
env = [
    "PHPIX_PHP_THREADS=4"
]
